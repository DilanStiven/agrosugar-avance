apiVersion: v1
kind: Service
metadata:
  name: ndvi-api-clusterip
spec:
  type: ClusterIP
  selector:
    app: ndvi-api
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: ndvi-api-lb
spec:
  type: LoadBalancer
  selector:
    app: ndvi-api
  ports:
  - port: 80
    targetPort: 8000
