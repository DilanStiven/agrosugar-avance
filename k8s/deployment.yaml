apiVersion: apps/v1
kind: Deployment
metadata:
  name: ndvi-api
  labels:
    app: ndvi-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ndvi-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ndvi-api
    spec:
      containers:
      - name: ndvi-api
        image: agrosugar-ndvi:1.0
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: 100m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
